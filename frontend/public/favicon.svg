<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="100"
  height="100"
>
  <defs>
    <linearGradient
      id="nexaGradient"
      x1="15"
      y1="15"
      x2="85"
      y2="85"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Premium dark background -->
  <rect
    x="4"
    y="4"
    width="92"
    height="92"
    rx="24"
    fill="#0f172a"
  />

  <!-- Shopping cart -->
  <path
    d="M25 29h8l7 37h31l8-27H39"
    fill="none"
    stroke="url(#nexaGradient)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Cart handle -->
  <path
    d="M25 29l-5-5"
    fill="none"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Wheels -->
  <circle
    cx="46"
    cy="78"
    r="5"
    fill="#ffffff"
  />

  <circle
    cx="72"
    cy="78"
    r="5"
    fill="#ffffff"
  />

  <!-- N mark -->
  <path
    d="M45 42v12l10-12v12"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>